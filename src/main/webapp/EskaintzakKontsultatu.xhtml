<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:p="primefaces">
<ui:composition template="/WEB-INF/facelets/templates/Txantiloia.xhtml">
	<ui:define name="izenburua">Eskaintzak kontsultatu</ui:define>
	<ui:define name="gorputza">
		<h2>Eskaintzak bilatu</h2>
		<h:form id="kontsultaForm">
			<p>
				<h:inputText id="bilaketa" value="#{kontsultatu.bilaketa}" size="40" />
				<h:commandButton styleClass="botoia" value="Bilatu" action="#{kontsultatu.bilatu}">
					<f:ajax execute="bilaketa" render="taula mezuak" />
				</h:commandButton>
			</p>

			<h4>Eskaintzak (sakatu "Ikusi" eskaintza ikusteko)</h4>
			<p:dataTable id="taula" value="#{kontsultatu.eskaintzak}" var="s"
				emptyMessage="Ez daude eskaintzak">
				<p:column headerText="Tituloa">#{s.title}</p:column>
				<p:column headerText="Prezioa">
					<h:outputText value="#{s.price}">
						<f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
					</h:outputText>
				</p:column>
				<p:column headerText="Argitarapen eguna">
					<h:outputText value="#{s.publicationDate}">
						<f:convertDateTime pattern="dd-MM-yyyy" />
					</h:outputText>
				</p:column>
				<p:column>
					<h:commandButton styleClass="botoia" value="Ikusi" action="#{kontsultatu.ikusi(s)}" />
				</p:column>
			</p:dataTable>

			<p>
				<h:commandButton styleClass="botoia" value="Itxi" action="hasiera" immediate="true" />
			</p>
			<h:messages id="mezuak" styleClass="mezuak" />
		</h:form>
	</ui:define>
</ui:composition>
</html>
